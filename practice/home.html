<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>

    <style>
        .box_container {
            background-color: lightseagreen;
            margin: 5px;
            padding: 10px;
        }
        
        .box {
            background-color: rgb(108, 120, 6);
            margin: 5px;
            padding: 10px;
            border: 2px solid rgb(131, 4, 4);
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
        }
        
        .grid_container {
            background-color: lightcoral;
            text-align: center;
            margin: 5px;
            padding: 10px;
            border: 2px solid rgb(131, 4, 4);
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
        }
        
        @media(max-width: 600px) {
            .grid_container {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>

<body>
    <h1>welcome to vignan</h1>
    <div class="box_container">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
    </div>

    <div class="grid_container">
        <div class="gridbox">box1</div>
        <div class="gridbox">box2</div>
        <div class="gridbox">box3</div>
        <div class="gridbox">box4</div>
        <div class="gridbox">box5</div>
    </div>

</body>

</html>
